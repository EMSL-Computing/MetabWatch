[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metab-qc"
version = "0.1.0"
description = "LCMS QC watcher workflow: process Thermo .raw files and refresh an HTML compound dashboard"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "kheal" },
]
keywords = [
    "metabolomics",
    "lcms",
    "qc",
    "corems",
    "mass-spectrometry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "CoreMS==4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
]

[project.urls]
Homepage = "https://github.com/kheal/Metab_QC"
Repository = "https://github.com/kheal/Metab_QC"
"Bug Tracker" = "https://github.com/kheal/Metab_QC/issues"

[project.scripts]
metab-qc = "pipeline:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
py-modules = ["config", "pipeline", "targeted_search_for_standards"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synthesis = ["templates/*"]
