[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabwatch"
version = "0.1.0"
description = "MetabWatch: automated LC–MS metabolomics QC watcher for Thermo .raw files"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "kheal" },
]
keywords = [
    "metabwatch",
    "metabolomics",
    "lcms",
    "qc",
    "corems",
    "mass-spectrometry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "tqdm",
    "CoreMS==4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
]

[project.scripts]
metabwatch = "metabwatch.pipeline:main"

# Map import name `metabwatch` → on-disk tree `src/` (no nested src/metabwatch/).
# So `from metabwatch.processor import ...` loads src/processor/, etc.
[tool.setuptools.package-dir]
metabwatch = "src"

[tool.setuptools]
packages = [
    "metabwatch",
    "metabwatch.output",
    "metabwatch.pipeline_queue",
    "metabwatch.processor",
    "metabwatch.state",
    "metabwatch.synthesis",
    "metabwatch.watcher",
]

[tool.setuptools.package-data]
"metabwatch.synthesis" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
