# CoreMS 4.0.1 LC-MS overrides used by MetabWatch.
# Omitted LiquidChromatograph keys keep CoreMS defaults.
# Empty [mass_spectrum] is required by CoreMS 4.0.1's TOML loader.

[LiquidChromatograph]
smooth_window = 9
consecutive_scan_min = 5
min_peak_datapoints = 2.0
ph_smooth_it = 0
ph_inten_min_rel = 0.003
ph_persis_min_rel = 0.003
mass_feature_cluster_rt_tolerance = 0.1
remove_mass_features_by_peak_metrics = true
verbose_processing = false

[LiquidChromatograph.mass_feature_attribute_filter_dict.noise_score_max]
value = 0.8
operator = ">="

[LiquidChromatograph.mass_feature_attribute_filter_dict.noise_score_min]
value = 0.5
operator = ">="

[LiquidChromatograph.mass_feature_attribute_filter_dict.gaussian_similarity]
value = 0.7
operator = ">="

[LiquidChromatograph.mass_feature_attribute_filter_dict.tailing_factor]
value = 1.5
operator = "<="

[mass_spectrum]
