name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tag = "${{ github.ref_name }}" -replace '-rc\.?\d+$',''
          if ("v$v" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match pyproject version $v"
          }

      - name: Build (venv, PyInstaller, self-test, checksum)
        shell: pwsh
        run: |
          .\packaging\build.ps1 -Clean -Python (Get-Command python).Source

      - uses: actions/upload-artifact@v4
        with:
          name: MetabWatch-windows
          path: |
            dist/MetabWatch-*.exe
            dist/MetabWatch-*.exe.sha256
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = "${{ github.ref_name }}"
          $ver  = $tag.TrimStart('v')
          $base = $ver -replace '-rc\.?\d+$',''

          $notes = @(); $on = $false
          foreach ($line in Get-Content docs/CHANGELOG.md) {
            if ($line -match '^## \[') { $on = ($line -match "^## \[$([regex]::Escape($base))\]"); continue }
            if ($on) { $notes += $line }
          }
          if (-not ($notes -join '').Trim()) { $notes = @("MetabWatch $ver") }
          $notes | Set-Content release-notes.md

          $extra = @()
          if ($tag -match '-rc') { $extra += '--prerelease' }

          gh release create $tag `
            (Get-ChildItem dist\MetabWatch-*.exe).FullName `
            (Get-ChildItem dist\MetabWatch-*.exe.sha256).FullName `
            --draft --title "MetabWatch $ver" --notes-file release-notes.md @extra
